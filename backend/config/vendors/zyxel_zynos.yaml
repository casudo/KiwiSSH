### Zyxel ZyNOS Vendor Configuration

vendor:
  id: "zyxel_zynos"
  name: "Zyxel ZyNOS"
  description: "Used in Zyxel ZyNOS devices"

### Session-level output behavior.
session:
  comment_prefix: "! "
  prompt: '^([\w.@()\-<]+[#>]\s?)$'
  pagination:
    enabled: true
    patterns:
      - pattern: '(\e\[1M\e\[\??\d+(;\d+)*[A-Za-z]\e\[1L)|(\eE)' # line control sequences
        response: " "
      - pattern: '\e\[\??\d+(;\d+)*[A-Za-z]' # used vty100 control sequences
        response: " "
      - pattern: '^(Copyright .*)\n^([\w.@()\-<]+[#>]\s?)$' # copyright motd
        response: " "

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "enable"
      then: ["{{ enable_password }}"]

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show version"
      metadata: true
    - command: "show system-information"
      metadata: true
    - command: "show running-config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  # strip_patterns:
    # - "^% Invalid input detected at '\\^' marker\\.$"
    # - "^\\s+\\^$"
    # - "^#config-version="
    # - "^conf_file_ver=.*$"
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '^(snmp-server get-community) \S+(.*)'
        replacement: '\1 <secret hidden> \2'
      - search: '^(snmp-server set-community) \S+(.*)'
        replacement: '\1 <secret hidden> \2'
      - search: '^(logins username) \S+(.*) (password) \S+(.*)'
        replacement: '\1 <secret hidden> \2 \3 <secret hidden> \4'
      - search: '^(admin-password) \S+(.*)'
        replacement: '\1 <secret hidden> \2'
      - search: '^(password) \S+(.*) (privilege \S+)'
        replacement: '\1 <secret hidden> \2 \3'
