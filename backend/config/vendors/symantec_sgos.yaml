### Symantec SGOS Vendor Configuration

vendor:
  id: "symantec_sgos"
  name: "Symantec SGOS"
  description: "Used in Symantec SGOS devices"

### Session-level output behavior.
session:
  comment_prefix: "!- "
  prompt: '\w+>|#'
  pagination:
    enabled: true
    patterns:
      - pattern: '--More--'
        response: " "

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "enable"
      then: ["{{ enable_password }}"]

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show licenses"
      metadata: true
    - command: "show general"
      metadata: true
    - command: "show configuration expanded noprompts with-keyrings unencrypted"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - '^(!- Local time).*'
    - '^(archive-configuration encrypted-password).*'
    - '^(download encrypted-password).*'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '^(security hashed-enable-password).*'
        replacement: '\1 <secret hidden>'
      - search: '^(security hashed-password).*'
        replacement: '\1 <secret hidden>'
