### Nokia SR OS Model-Driven CLI Vendor Configuration

### Nokia SR OS (formerly TiMOS) (formerly TiMetra, Alcatel, Alcatel-Lucent).
### Used in 7705 SAR, 7210 SAS, 7450 ESS, 7750 SR, 7950 XRS, and NSP.
### For the classic CLI, use alcatel_sros.yaml instead.

vendor:
  id: "nokia_srosmd"
  name: "Nokia SR OS (MD-CLI)"
  description: "Nokia SR OS devices in model-driven CLI mode (7705 SAR, 7210 SAS, 7450 ESS, 7750 SR, 7950 XRS, NSP)"

### Session-level output behavior.
session:
  comment_prefix: "# "
  prompt: '^([-\w.@:>*]+\s?[#>]\s?)$'

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "environment more false"

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show system information"
      metadata: true
    - command: "show card state"
      metadata: true
    - command: "show chassis"
      metadata: true
    - command: "file show bootlog.txt"
      metadata: true
    - command: "admin show configuration debug full-context"
      metadata: true
    - command: "file show config.dbg"
      metadata: true
    - command: "admin show configuration configure | match persistent-indices post-lines 10000"
      metadata: true
    - command: "admin show configuration bof full-context"
      show_command_in_config: true
    - command: "admin show configuration configure full-context"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "logout"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - '^System Up Time'
    - '^# Finished '
    - '^# Generated '
    ### MD-CLI prints its context (e.g. '[/]' or '[ex:/configure]') on its own line above the prompt
    - '^\[(?:\w+:)?/[^\]]*\]$'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    # patterns:
    #   - search: "^(#private-encryption-key=).+"
    #     replacement: "\\1<secret hidden>"
