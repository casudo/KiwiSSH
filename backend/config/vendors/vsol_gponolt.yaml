### VSOL GPON OLT Vendor Configuration
## Instructions for backing up VSOL GPON OLT devices

vendor:
  id: "vsol_gponolt"
  name: "VSOL"
  description: "Tested with VSOL V1600G0-B GPON OLT, software V1.4.13R"

### Session-level output behavior.
session:
  comment_prefix: "! "
  prompt: '^([\w.@|()\/-]+[#>]\s?)$'
  pagination:
    enabled: true
    patterns:
      - pattern: '\x20*--More--\x20*\x00?'
        response: " "

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "enable"
      then: ["{{ enable_password }}"]
    - command: "configure terminal"

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show version"
      metadata: true
    - command: "show pon transceiver-info all"
      metadata: true
    - command: "show running-config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "end"
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - '(?:\r?\n[ \t]*){2,}'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '^(snmp-server .*community) \S+'
        replacement: '\1 <secret hidden>'
      - search: '(login-password)\s+\S+'
        replacement: '\1 <secret hidden>'
      - search: '(enable-password)\s+\S+'
        replacement: '\1 <secret hidden>'
      - search: '(username \S+ enable \S+)\s+\S+'
        replacement: '\1 <secret hidden>'
      - search: '(user_control enable \S+)\s+\S+'
        replacement: '\1 <secret hidden>'
      - search: '(shared_key)\s+\S+'
        replacement: '\1 <secret hidden>'
