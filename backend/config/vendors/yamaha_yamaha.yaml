### YAMAHA NVR/RTX Series Vendor Configuration

vendor:
  id: "yamaha_yamaha"
  name: "Yamaha NVR/RTX Series"
  description: "Yamaha NVR/RTX Series, works with Yamaha NVR and RTX devices"

### Session-level output behavior.
session:
  comment_prefix: "# "
  prompt: '^([\w.@()-]+[#>]\s?)$'
  pagination:
    enabled: true
    patterns:
      - pattern: '^---more---$'
        response: " "
      - pattern: '^Save new configuration'
        response: "N"

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "console lines infinity"
    - command: "console columns  200"
    - command: "console character ascii"
    - command: "administrator"
      then: ["{{ enable_password }}"]

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - '^Error: Invalid command name$|^\s+\^$'
    - '^(# Reporting Date:\s+)(.*)$'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    # patterns:
    #   - search: '("password"\s*:\s*)".*?"'
    #     replacement: '\1"<hidden>"'
