### Sofinet SOFOS Vendor Configuration

vendor:
  id: "sofinet_sofos"
  name: "Sofinet SOFOS"
  description: "Sofinet SOFOS network switches"

### Session-level output behavior.
session:
  comment_prefix: "# "
  prompt: '[#>]\s*$'
  pagination:
    enabled: true
    patterns:
      - pattern: '---MORE---|--More--'
        response: " "

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show version"
      metadata: true
    - command: "show running-config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - '\r'
    - '\e\[[0-9;]*m'
    - '---MORE---'
    - '--More--'
    - '^ {13}'
    - '^\s+\n'
    - '^Building Configuration\.\.\.\s*\n(?:done\s*\n)?'
    - '^! Current configuration :.*\n'
    - '^! Last configuration change.*\n'
    - '^! Flash config last updated at .*\n'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '(password\s+\d+\s+)\S+'
        replacement: '\1<secret hidden>'
      - search: '(enable password\s+)\S+(\s+encrypt)'
        replacement: '\1<secret hidden>\2'
      - search: '(wpa key\s+\d+\s+)\S+'
        replacement: '\1<secret hidden>'
      - search: '(ap user admin password\s+\d+\s+)\S+'
        replacement: '\1<secret hidden>'
      - search: '(key\s+\d+\s+)\S+'
        replacement: '\1<secret hidden>'
      - search: '(crypto ike key\s+)\S+'
        replacement: '\1<secret hidden>'
      - search: '(snmp-server community\s+)\S+'
        replacement: '\1<secret hidden>'
