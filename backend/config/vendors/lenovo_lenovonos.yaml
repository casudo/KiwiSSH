### Lenovo Network OS Vendor Configuration
## Instructions for backing up Lenovo Network OS devices

vendor:
  id: "lenovo_lenovonos"
  name: "Lenovo Network OS"
  description: "Lenovo Network OS devices"

### Session-level output behavior.
session:
  comment_prefix: "! "
  prompt: '^([\w.@()-]+[#>]\s?)$'

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "enable"
      then: "{{ enable_password }}"
    - command: "terminal-length 0"

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show version"
      metadata: true
    - command: "show boot"
      metadata: true
    - command: "show transceiver"
      metadata: true
    - command: "show software-key"
      metadata: true
    - command: "show running-config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - '^% Invalid input detected at'
    - '^Current configuration:[^\n]*\n'
    - '(.* password )"[0-9a-f]+"(.*)'
    - '(.* administrator-password )"[0-9a-f]+"(.*)'
    - '(.*ekey )"[0-9a-f]+"(.*)'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '^(enable password) \S+(.*)'
        replacement: '\1 <redacted>\2'
      - search: '^(access user \S+ password) \S+(.*)'
        replacement: '\1 <redacted>\2'
      - search: '^(snmp-server \S+-community) \S+(.*)'
        replacement: '\1 <redacted>\2'
      - search: '^(tacacs-server \S+ \S+ ekey) \S+(.*)'
        replacement: '\1 <redacted>\2'
      - search: '^(ntp message-digest-key \S+ md5-ekey) \S+(.*)'
        replacement: '\1 <redacted>\2'
      - search: '(.* password )"[0-9a-f]+"(.*)'
        replacement: '\1"<redacted>"\2'
      - search: '(.*ekey )"[0-9a-f]+"(.*)'
        replacement: '\1"<redacted>"\2'
