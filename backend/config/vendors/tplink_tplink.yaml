### TPLink Vendor Configuration
## Instructions for backing up TPLink devices

vendor:
  id: "tplink_tplink"
  name: "TPLink"
  description: "TPLink devices"

### Session-level output behavior.
session:
  comment_prefix: "! "
  prompt: '^\r?([\w.@()-]+[#>]\s?)$'
  pagination:
    enabled: true
    patterns:
      - pattern: 'Press\s?any\s?key\s?to\s?continue\s?\(Q\s?to\s?quit\)'
        response: " "

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "terminal length 0"

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show system-info"
      metadata: true
    - command: "show running-config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"
    - command: "logout"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  strip_patterns:
    - 'Press any key to'
  # config_start: "^config "
  # config_end: "^end$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '^enable password (\S+)'
        replacement: 'enable password <secret hidden>'
      - search: '^user (\S+) password (\S+) (.*)'
        replacement: 'user \1 password <secret hidden> \3'
      - search: '^(snmp-server community).*'
        replacement: '\1 <secret hidden>'
      - search: 'secret (\d+) (\S+).*'
        replacement: '<secret hidden>'
