### SonicWall SonicOS Vendor Configuration

vendor:
  id: "sonicwall_sonicos"
  name: "SonicWall SonicOS"
  description: "SonicWall firewalls (e.g. NSA series) running SonicOS 6.5 or 7.x"

### Session-level behavior
session:
  comment_prefix: "! "
  prompt: '^[\w.-]+@[\w.-]+>\s?(\(.+\)\s?)?$'
  pagination:
    enabled: true
    patterns:
      ### Login policy banner: "Accept The Policy Banner (yes)?" followed by a "yes:" input line
      - pattern: '^yes:\s*$'
        response: "yes\n"

### Commands to execute for backup
## Supported step types in command phases:
## - command: sends command text
## - command + then: sends command text, then sends interactive input
commands:
  ### Pre-backup commands (prepare the session) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  pre_backup:
    - command: "no cli pager session"

  ### Main backup command(s)
  ## Commands whose output becomes the stored configuration
  backup:
    - command: "show version"
      metadata: true
    - command: "show current-config"
      show_command_in_config: true

  ### Post-backup commands (cleanup) (OPTIONAL)
  ## Command outputs aren't saved in stored configuration
  post_backup:
    - command: "exit"

### Configuration processing rules
## Processing reduces diff noise and trims non-config boilerplate
processing:
  ### Lines to strip from captured config (regex patterns)
  strip_patterns:
    - '^: '
    - 'date \d{4}:\d{2}:\d{2}'
    - 'time \d{2}:\d{2}:\d{2}'
    - 'system-time "\d{2}/\d{2}/\d{4} \d{2}:\d{2}:\d{2}\.\d+"'
    - 'system-uptime "(?:\s+up\s+\d+\s+|\d+ \w+(?:, \d+ \w+)*)"'
    - 'checksum \d+'
  # config_start: "^# unifi$"
  # config_end: "^# misc$"
  ### Secret masking. When enabled=false, no redaction is applied.
  redaction:
    enabled: false
    patterns:
      - search: '\b((?:shared-)?secret|(?:bind-)?password|smtp-pass|pop-pass|shared-key|passphrase|authentication sha1|encryption aes) \d,\S+'
        replacement: '\1 <secret hidden>'
