name: Build and Publish Docker Images on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_frontend:
        description: Build and push the frontend image
        type: boolean
        default: true
      build_backend:
        description: Build and push the backend image
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ### Release notes must contain a "## Versions" section, e.g.:
      ##   Frontend: v1.5.0
      ##   Backend: v2.7.0 -> v2.7.1
      ### An image is only built if its line contains an arrow "->" (version bump).
      - name: Determine which images to build
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          INPUT_FRONTEND: ${{ inputs.build_frontend }}
          INPUT_BACKEND: ${{ inputs.build_backend }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("RELEASE_BODY", "").replace("\r\n", "\n")
          section = re.search(r"^#+\s*Versions\s*$(.*?)(?=^#|\Z)", body, re.IGNORECASE | re.MULTILINE | re.DOTALL)

          def should_build(name):
            if os.environ["EVENT_NAME"] == "workflow_dispatch":
              return os.environ[f"INPUT_{name.upper()}"] == "true"
            if not section:
              print(f"::warning::No '## Versions' section in release notes, building {name} image")
              return True
            match = re.search(rf"^[\s*_-]*{name}[\s*_]*:(.*)$", section.group(1), re.IGNORECASE | re.MULTILINE)
            if not match:
              print(f"::warning::No '{name}:' line in release notes, building {name} image")
              return True
            return "->" in match.group(1) or "→" in match.group(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            for name in ("frontend", "backend"):
              build = should_build(name)
              print(f"{name}: {'build' if build else 'skip'}")
              out.write(f"{name}={str(build).lower()}\n")
          PY

      - name: Generate image names and versions
        id: meta
        run: |
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          FRONTEND_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("frontend/src/main.ts").read_text()
          match = re.search(r"FRONTEND_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not match:
            raise SystemExit("Frontend version not found")
          print(match.group(1))
          PY
          )
          BACKEND_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("backend/app/__init__.py").read_text()
          match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not match:
            raise SystemExit("Backend version not found")
          print(match.group(1))
          PY
          )
          echo "frontend=${BASE}-frontend" >> $GITHUB_OUTPUT
          echo "backend=${BASE}-backend" >> $GITHUB_OUTPUT
          echo "frontend_version=$FRONTEND_VERSION" >> $GITHUB_OUTPUT
          echo "backend_version=$BACKEND_VERSION" >> $GITHUB_OUTPUT

      # -----------------
      # Build frontend
      # -----------------
      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile_frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.frontend }}:v${{ steps.meta.outputs.frontend_version }}
            ${{ steps.meta.outputs.frontend }}:latest

      # -----------------
      # Build backend
      # -----------------
      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile_backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.backend }}:v${{ steps.meta.outputs.backend_version }}
            ${{ steps.meta.outputs.backend }}:latest
